<!DOCTYPE html>
<html lang="zh-CN" data-theme="neon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06050c">
  <title>贪吃蛇 · Snake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306050c'/%3E%3Cpath d='M7 22h11v-9h6' stroke='%232ef2ff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='7' r='3' fill='%23ff2a6d'/%3E%3C/svg%3E">
  <style>
:root {
    --bg: #06050c;
    --surface: #0f0d1c;
    --surface-2: #181530;
    --border: #282247;
    --text: #eef0ff;
    --muted: #8c88b4;
    --accent: #2ef2ff;
    --accent-ink: #001a1f;
    --gold: #ffe45e;
    --board: #07060f;
    --glow-rgb: 46, 242, 255;
    --gold-rgb: 255, 228, 94;
    --overlay: rgba(6, 5, 12, 0.62);
    --overlay-menu: rgba(6, 5, 12, 0.5);
    --primary-hover: #8af8ff;
    --badge-bg: var(--gold);
    --badge-ink: #2b2100;
    --score-a: #ffffff;
    --score-b: #2ef2ff;
    --toast-bg: rgba(15, 13, 28, 0.88);
    --toast-text: var(--gold);
    --footer: #4c4770;
    --radius-stage: 18px;
    --btn-radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --brand-mark:
        radial-gradient(circle at 72% 28%, #ffe45e 0 3.5px, transparent 4px),
        linear-gradient(135deg, #2ef2ff, #8b5cff 55%, #ff2bd6);
    --page-bg:
        radial-gradient(1100px 520px at 50% -12%, rgba(255, 43, 214, 0.13), transparent 62%),
        radial-gradient(900px 420px at 50% 112%, rgba(46, 242, 255, 0.09), transparent 62%),
        var(--bg);

    /* 棋盘边长：受视口宽、高共同约束 */
    --stage: clamp(260px, min(94vw, calc(100vh - 240px)), 560px);
}

@supports (height: 100svh) {
    :root { --stage: clamp(260px, min(94vw, calc(100svh - 240px)), 560px); }
}

@media (pointer: coarse) {
    :root { --stage: clamp(260px, min(94vw, calc(100vh - 360px)), 560px); }
    @supports (height: 100svh) {
        :root { --stage: clamp(260px, min(94vw, calc(100svh - 360px)), 560px); }
    }
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
}

body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: var(--page-bg);
    background-color: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: min(100%, 560px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin: auto 0; /* 纵向居中，内容过高时仍可滚动 */
}

/* ---------- 顶栏 ---------- */
.topbar {
    width: max(var(--stage), min(100%, 360px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--brand-mark);
    box-shadow: 0 6px 20px -6px rgba(var(--glow-rgb), 0.6);
}

h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.1;
}

.brand-sub {
    margin: 2px 0 0;
    font-size: 10px;
    letter-spacing: 0.32em;
    color: var(--muted);
}

/* 得分是主角，最高分与等级退为一行小字 */
.hud {
    display: flex;
    align-items: center;
    gap: 14px;
}

.hud-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 0;
    padding-right: 14px;
    border-right: 1px solid var(--border);
    font-size: 12px;
    text-align: right;
}

.hud-meta div {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.hud-meta dt {
    color: var(--muted);
    letter-spacing: 0.08em;
}

.hud-meta .is-me dt {
    color: var(--accent);
    font-weight: 700;
}

.hud-meta dd {
    min-width: 2.5em;
    margin: 0;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.hud-score {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 3.2em;
}

.hud-score-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.2em;
}

.hud-score-value {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
}

.hud-score-value.bump {
    animation: bump 0.32s ease;
}

@keyframes bump {
    40% { transform: scale(1.22); color: var(--accent); }
}

/* ---------- 棋盘 ---------- */
.stage {
    position: relative;
    width: var(--stage);
    height: var(--stage);
    border-radius: var(--radius-stage);
    overflow: hidden;
    background: var(--board);
    box-shadow:
        0 0 0 1px var(--border),
        0 30px 80px -24px rgba(0, 0, 0, 0.75),
        0 0 60px -20px rgba(var(--glow-rgb), 0.18);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

/* ---------- 浮层 ---------- */
.overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    overflow: auto;
    background: var(--overlay);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: opacity 0.25s ease, visibility 0s;
}

/* 菜单时让背后的演示蛇透出来 */
.overlay[data-screen="menu"] {
    background: var(--overlay-menu, var(--overlay));
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}

.overlay[data-screen=""] {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.25s ease, visibility 0s linear 0.25s;
}

.panel {
    display: none;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: min(100%, 320px);
    text-align: center;
    animation: rise 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.overlay[data-screen="menu"] [data-panel="menu"],
.overlay[data-screen="paused"] [data-panel="paused"],
.overlay[data-screen="over"] [data-panel="over"],
.overlay[data-screen="sync"] [data-panel="sync"] {
    display: flex;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
}

.panel-title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
}

/* ---------- 谁来玩 ---------- */
.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.player {
    position: relative;
    cursor: pointer;
}

.player input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.player-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--btn-radius);
    border: 1px solid var(--border);
    background: var(--surface);
    opacity: 0.6;
    transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.player:hover .player-card {
    opacity: 0.85;
}

.player input:checked + .player-card {
    opacity: 1;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px -12px rgba(var(--glow-rgb), 0.8);
}

.player input:focus-visible + .player-card {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* 头像用玩家自己的主题配色，不随当前主题变化 */
.avatar {
    position: relative;
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 800;
}

.avatar[data-theme="neon"] {
    color: #06050c;
    background: linear-gradient(135deg, #2ef2ff, #ff2bd6);
}

.avatar[data-theme="scifi"] {
    color: #ffe81f;
    background: #05060f;
    box-shadow: inset 0 0 0 2px #ffe81f;
    font-family: "SF Mono", "Menlo", "Consolas", "PingFang SC", monospace;
}

.avatar[data-theme="sweet"] {
    color: #ffffff;
    background: linear-gradient(135deg, #ffb3d1, #ff7eb3 55%, #c9a7ff);
    box-shadow: inset 0 0 0 2px #ffffff;
}

.crown {
    position: absolute;
    top: -10px;
    right: -6px;
    font-size: 14px;
    font-style: normal;
    transform: rotate(18deg);
}

.crown[hidden] {
    display: none;
}

.player-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.15;
}

.player-label {
    font-size: 11px;
    color: var(--muted);
}

.player-info b {
    font-size: 20px;
    font-variant-numeric: tabular-nums;
}

/* ---------- 玩法（折叠） ---------- */
.more {
    border-radius: var(--btn-radius);
    border: 1px solid var(--border);
    background: var(--surface);
}

.more summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    list-style: none;
}

.more summary::-webkit-details-marker {
    display: none;
}

.more summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--btn-radius);
}

.combo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
}

.combo::after {
    content: "";
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: translateY(-2px) rotate(45deg);
    transition: transform 0.2s;
}

.more[open] .combo::after {
    transform: translateY(1px) rotate(-135deg);
}

.more .options {
    padding: 0 12px 12px;
}

.options {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 10px 12px;
}

.option-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
}

.option-hint {
    grid-column: 2;
    margin: -4px 0 0;
    min-height: 1.4em;
    font-size: 12px;
    color: var(--muted);
}

.segmented {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    padding: 4px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
}

.segmented label {
    position: relative;
    cursor: pointer;
}

.segmented input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.segmented span {
    display: block;
    padding: 7px 0;
    border-radius: 9px;
    font-size: 14px;
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
}

.segmented label:hover span {
    color: var(--text);
}

.segmented input:checked + span {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
}

.segmented input:focus-visible + span {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ---------- 按钮 ---------- */
button {
    font: inherit;
    color: inherit;
}

.btn {
    padding: 12px 18px;
    border-radius: var(--btn-radius);
    border: 1px solid transparent;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s, background 0.2s, box-shadow 0.2s;
}

.btn:active {
    transform: scale(0.97);
}

.btn:focus-visible,
.icon-btn:focus-visible,
.dpad-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 10px 30px -10px rgba(var(--glow-rgb), 0.7);
}

.btn-primary:hover {
    background: var(--primary-hover);
}

.btn-ghost {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
}

.btn-ghost:hover {
    background: var(--surface-2);
}

.btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* ---------- 战报 ---------- */
.link-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: -4px;
    font-size: 13px;
    color: var(--muted);
}

.link-btn {
    padding: 4px 6px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
}

.link-btn:hover {
    color: var(--text);
}

.link-btn:focus-visible {
    outline: 2px solid var(--accent);
}

.sync-hint {
    margin: -4px 0 0;
    font-size: 13px;
    color: var(--muted);
}

.sync-text {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: 13px/1.5 var(--font);
    resize: none;
    -webkit-user-select: text;
    user-select: text;
}

.sync-text:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

/* ---------- 结算 ---------- */
.badge {
    align-self: center;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: var(--badge-ink);
    background: var(--badge-bg);
    box-shadow: 0 0 24px -4px rgba(var(--gold-rgb), 0.7);
}

.badge[hidden] {
    display: none;
}

.final-score {
    margin: -4px 0 0;
    font-size: 52px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--score-a), var(--score-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.over-gap {
    margin: -4px 0 6px;
    min-height: 1.4em;
    font-size: 13px;
    color: var(--muted);
}

.over-gap strong {
    color: var(--gold);
    font-variant-numeric: tabular-nums;
}

/* ---------- 提示条 ---------- */
.toast {
    position: absolute;
    top: 12%;
    left: 50%;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--toast-bg);
    border: 1px solid rgba(var(--gold-rgb), 0.4);
    color: var(--toast-text);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -8px);
}

.toast.show {
    animation: toast 1.6s ease forwards;
}

@keyframes toast {
    0% { opacity: 0; transform: translate(-50%, -8px); }
    15%, 75% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -6px); }
}

/* ---------- 工具栏 ---------- */
.toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px 12px;
}

.icon-btn {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s, transform 0.12s, opacity 0.2s;
}

/* 菜单与结算时暂停键用不了、重开键和主按钮重复，干脆不出现 */
.app[data-screen="menu"] #pauseBtn,
.app[data-screen="menu"] .toolbar [data-action="restart"],
.app[data-screen="over"] #pauseBtn,
.app[data-screen="over"] .toolbar [data-action="restart"],
.app[data-screen="sync"] #pauseBtn,
.app[data-screen="sync"] .toolbar [data-action="restart"] {
    display: none;
}

.icon-btn:hover {
    background: var(--surface-2);
}

.icon-btn:active {
    transform: scale(0.92);
}

.icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
}

.icon-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
}

.icon-btn svg[fill="none"] {
    fill: none;
}

.icon-play,
.icon-mute,
#pauseBtn.is-paused .icon-pause,
#soundBtn.is-muted .icon-sound {
    display: none;
}

#pauseBtn.is-paused .icon-play,
#soundBtn.is-muted .icon-mute {
    display: block;
}

/* ---------- 触屏方向键 ---------- */
.dpad {
    display: none;
    grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 4px;
}

@media (pointer: coarse) {
    .dpad { display: grid; }
    .keys { display: none; }
}

.dpad-btn {
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: background 0.15s, transform 0.1s;
}

.dpad-btn svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.dpad-btn:active {
    background: var(--surface-2);
    transform: scale(0.92);
}

.dpad-btn[data-dir="up"]    { grid-area: up; }
.dpad-btn[data-dir="left"]  { grid-area: left; }
.dpad-btn[data-dir="right"] { grid-area: right; }
.dpad-btn[data-dir="down"]  { grid-area: down; }

/* ---------- 底部 ---------- */
.keys {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    transition: opacity 0.3s;
}

/* 键位说明只在菜单出现，游戏中不打扰；占位保留，避免布局跳动 */
.app:not([data-screen="menu"]) .keys {
    opacity: 0;
}

kbd {
    padding: 1px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    background: var(--surface);
    font-family: inherit;
    font-size: 11px;
    color: var(--text);
}

.footer {
    font-size: 12px;
    color: var(--footer);
    letter-spacing: 0.06em;
}

@media (max-width: 420px) {
    .hud { gap: 12px; }
    .hud-meta { padding-right: 12px; }
    .final-score { font-size: 44px; }
}

@media (prefers-reduced-motion: reduce) {
    *:not(.toast), *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

/* =====================================================
   主题：星际
   ===================================================== */
html[data-theme="scifi"] {
    --bg: #03040a;
    --surface: rgba(12, 16, 28, 0.9);
    --surface-2: rgba(24, 30, 50, 0.95);
    --border: rgba(255, 232, 31, 0.22);
    --text: #e8ecf4;
    --muted: #7d8aa3;
    --accent: #ffe81f;
    --accent-ink: #0a0a00;
    --gold: #7df9ff;
    --gold-rgb: 125, 249, 255;
    --glow-rgb: 255, 232, 31;
    --board: #02030a;
    --overlay: rgba(2, 3, 10, 0.66);
    --overlay-menu: rgba(2, 3, 10, 0.55);
    --primary-hover: #fff27a;
    --badge-bg: #7df9ff;
    --badge-ink: #00222a;
    --score-a: #fff7b0;
    --score-b: #ffe81f;
    --toast-bg: rgba(3, 4, 10, 0.88);
    --toast-text: #ffe81f;
    --footer: #4b5568;
    --radius-stage: 4px;
    --btn-radius: 4px;
    --font: "SF Mono", "Menlo", "Consolas", "PingFang SC", "Microsoft YaHei", monospace;
    --brand-mark:
        radial-gradient(circle, #ffe81f 0 3px, transparent 3.5px),
        radial-gradient(circle, transparent 0 8px, #ffe81f 8.5px 10.5px, transparent 11px),
        #05060f;
    --page-bg:
        radial-gradient(1px 1px at 25px 35px, rgba(255, 255, 255, 0.85), transparent 70%) 0 0 / 230px 230px,
        radial-gradient(1px 1px at 140px 80px, rgba(255, 255, 255, 0.6), transparent 70%) 0 0 / 230px 230px,
        radial-gradient(1.5px 1.5px at 90px 170px, rgba(255, 255, 255, 0.9), transparent 70%) 0 0 / 230px 230px,
        radial-gradient(1px 1px at 200px 20px, rgba(255, 255, 255, 0.5), transparent 70%) 0 0 / 230px 230px,
        radial-gradient(1px 1px at 60px 110px, rgba(180, 210, 255, 0.7), transparent 70%) 0 0 / 170px 170px,

        <svg class="icon-mute" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>

      <kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 移动 · <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重开 · <kbd>M</kbd> 静音 · <kbd>T</kbd> 主题
    </p>

  <script>
'use strict';

// 主题：配色、文案、音效与各元素的画法。app.js 只负责游戏逻辑与调度。
//
// 每个主题实现：
//   buildBackground(g, size, cell)            静态棋盘（尺寸或主题变化时绘制一次）
//   drawAmbient?(ctx, size, cell, now)        动态背景（可选）
//   drawWall(ctx, x, y, cell)                 障碍，x/y 为格子左上角像素
//   drawFood(ctx, cx, cy, cell, scale, now)   食物
//   drawBonus(ctx, cx, cy, cell, scale, now)  限时奖励
//   drawSnake(ctx, s)                         蛇，s 见 app.js 中 drawSnake()
//   sounds.{start,tick,eat,bonus,level,die,win,click}(audio)
window.SnakeThemes = (() => {
  const TAU = Math.PI * 2;

  // ================= 通用工具 =================
  const hexToRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const mix3 = (a, b, c, t) => (t < 0.5 ? mix(a, b, t * 2) : mix(b, c, (t - 0.5) * 2));
  const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function circle(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0, r), 0, TAU);
  }

  function heart(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.65, y - s * 1.25, x, y - s * 0.45);
    ctx.bezierCurveTo(x + s * 0.65, y - s * 1.25, x + s * 1.5, y - s * 0.1, x, y + s * 0.9);
    ctx.closePath();
  }

  function star(ctx, x, y, r, inner = 0.46, points = 5, rot = -Math.PI / 2) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = rot + (i * Math.PI) / points;
      const rr = i % 2 ? r * inner : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function tracePath(ctx, segs, px) {
    ctx.beginPath();
    segs.forEach(({ a, b }) => {
      ctx.moveTo(px(a.x), px(a.y));
      ctx.lineTo(px(b.x), px(b.y));
    });
  }

  // 可复现的伪随机，保证星空在重绘时位置不变
  function seeded(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function checker(g, size, cell, a, b) {
    g.fillStyle = a;
    g.fillRect(0, 0, size, size);
    g.fillStyle = b;
    const n = Math.round(size / cell);
    for (let y = 0; y < n; y++) {
      for (let x = y % 2; x < n; x += 2) g.fillRect(x * cell, y * cell, cell, cell);
    }
  }

  function drawParticle(ctx, p, cell) {
    const x = p.x * cell;
    const y = p.y * cell;
    const s = p.size * cell;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = p.color;
    switch (p.shape) {
      case 'spark': {
        const speed = Math.hypot(p.vx, p.vy) || 1;
        const len = Math.min(0.6, speed * 0.05) * cell;
        ctx.lineWidth = Math.max(1, s * 0.7);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - (p.vx / speed) * len, y - (p.vy / speed) * len);
        ctx.stroke();
        break;
      }
      case 'heart':
        heart(ctx, x, y, s * 1.5);
        ctx.fill();
        break;
      case 'sparkle':
        star(ctx, x, y, s * 2, 0.28, 4, p.life / 180);
        ctx.fill();
        break;
      default:
        circle(ctx, x, y, s);
        ctx.fill();
    }
  }

  const SYSTEM_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';

  // ================= 霓虹（默认）=================
  const neon = (() => {
    const CYAN = '#2ef2ff';
    const PINK = '#ff2a6d';
    const VIOLET = '#8b5cff';
    const C = {
      head: hexToRgb(CYAN),
      tail: hexToRgb('#ff2bd6'),
      dead: hexToRgb('#4a4766'),
    };

    // 霓虹灯管：宽而淡的光晕叠在细而亮的芯上
    function glowStroke(ctx, color, width, layers = [[3.2, 0.08], [2, 0.18]]) {
      layers.forEach(([k, a]) => {
        ctx.globalAlpha = a;
        ctx.strokeStyle = color;
        ctx.lineWidth = width * k;
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    return {
      id: 'neon',
      label: '霓虹',
      themeColor: '#06050c',
      font: SYSTEM_FONT,
      text: {
        sub: 'NEON SNAKE',
        menuTitle: '准备好了吗？',
        start: '开始游戏',
        paused: '已暂停',
        over: '游戏结束',
        win: '完美通关！',
        record: '🏆 新纪录',
        level: (n, maze) => `LEVEL ${n} · ${maze ? '新增障碍' : '速度提升'}`,
      },
      colors: {
        ring: 'rgba(255, 228, 94, 0.7)',
        countdown: CYAN,
        flash: '255, 43, 214',
        deathRing: 'rgba(255, 43, 214, 0.9)',
        float: { food: PINK, bonus: '#ffe45e' },
        particles: {
          eat: [PINK, '#ff8fb1', '#ffffff'],
          bonus: ['#ffe45e', '#fff6c2', CYAN],
          death: [CYAN, '#ff2bd6', '#ffffff', VIOLET],
          rock: [VIOLET, '#c4b0ff'],
          expire: ['#5c5880', '#8c88b4'],
        },
      },
      particleShapes: ['spark', 'dot'],
      gravity: 0,
      shake: 9,
      rings: true,

      buildBackground(g, size, cell) {
        g.fillStyle = '#07060f';
        g.fillRect(0, 0, size, size);

        // 底部一抹品红地平线辉光
        const horizon = g.createRadialGradient(size / 2, size * 1.15, 0, size / 2, size * 1.15, size * 0.9);
        horizon.addColorStop(0, 'rgba(255, 43, 214, 0.16)');
        horizon.addColorStop(1, 'rgba(255, 43, 214, 0)');
        g.fillStyle = horizon;
        g.fillRect(0, 0, size, size);

        // 网格线
        g.strokeStyle = 'rgba(139, 92, 255, 0.11)';
        g.lineWidth = 1;
        g.beginPath();
        for (let i = 1; i < size / cell; i++) {
          const v = Math.round(i * cell) + 0.5;
          g.moveTo(v, 0);
          g.lineTo(v, size);
          g.moveTo(0, v);
          g.lineTo(size, v);
        }
        g.stroke();

        // 交点亮点
        g.fillStyle = 'rgba(46, 242, 255, 0.18)';
        for (let y = 1; y < size / cell; y++) {
          for (let x = 1; x < size / cell; x++) {
            g.fillRect(Math.round(x * cell) - 0.5, Math.round(y * cell) - 0.5, 2, 2);
          }
        }

        const v = g.createRadialGradient(size / 2, size / 2, size * 0.3, size / 2, size / 2, size * 0.75);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, 'rgba(0,0,0,0.45)');
        g.fillStyle = v;
        g.fillRect(0, 0, size, size);
      },

      drawWall(ctx, x, y, cell) {
        const inset = cell * 0.16;
        const s = cell - inset * 2;
        roundRect(ctx, x + inset, y + inset, s, s, cell * 0.16);
        ctx.fillStyle = 'rgba(139, 92, 255, 0.16)';
        ctx.fill();
        glowStroke(ctx, VIOLET, Math.max(1.5, cell * 0.07), [[3, 0.12], [1.8, 0.25]]);
      },

      drawFood(ctx, cx, cy, cell, scale, now) {
        const r = cell * 0.26 * (1 + Math.sin(now / 230) * 0.07) * scale;
        if (r <= 0) return;
        const halo = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 2.6);
        halo.addColorStop(0, 'rgba(255, 42, 109, 0.45)');
        halo.addColorStop(1, 'rgba(255, 42, 109, 0)');
        ctx.fillStyle = halo;
        circle(ctx, cx, cy, r * 2.6);
        ctx.fill();
        circle(ctx, cx, cy, r);
        ctx.fillStyle = PINK;
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 230, 240, 0.9)';
        circle(ctx, cx, cy, r * 0.45);
        ctx.fill();
      },

      drawBonus(ctx, cx, cy, cell, scale, now) {
        const r = cell * 0.4 * scale;
        if (r <= 0) return;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(now / 700);
        ctx.lineJoin = 'round';
        star(ctx, 0, 0, r);
        ctx.fillStyle = 'rgba(255, 228, 94, 0.18)';
        ctx.fill();
        glowStroke(ctx, '#ffe45e', Math.max(1.5, cell * 0.07));
        ctx.restore();
      },

      drawSnake(ctx, s) {
        const { segs, head, cell, px, fade, now, dir, dead } = s;
        const headColor = mix(C.head, C.dead, fade);
        const tailColor = mix(C.tail, C.dead, fade);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 光晕
        if (!dead) {
          for (const [width, a] of [[1.35, 0.05], [1.05, 0.09]]) {
            ctx.strokeStyle = `rgba(46, 242, 255, ${a})`;
            ctx.lineWidth = cell * width;
            tracePath(ctx, segs, px);
            ctx.stroke();
          }
        }

        // 青 → 品红的连续灯管：先铺圆形关节补齐拐角和尾端，再用平头线段逐段渐变，
        // 避免圆头线段互相叠压出一圈圈"鳞片"
        const w = cell * 0.6;
        const step = 1 / Math.max(1, segs.length - 1);
        const color = (t) => rgba(mix(headColor, tailColor, Math.min(1, t)));
        segs.forEach(({ a, b, t }) => {
          ctx.fillStyle = color(t + step);
          circle(ctx, px(b.x), px(b.y), w / 2);
          ctx.fill();
        });
        ctx.lineCap = 'butt';
        ctx.lineWidth = w;
        segs.forEach(({ a, b, t }) => {
          const grad = ctx.createLinearGradient(px(a.x), px(a.y), px(b.x), px(b.y));
          grad.addColorStop(0, color(t));
          grad.addColorStop(1, color(t + step));
          ctx.strokeStyle = grad;
          ctx.beginPath();
          ctx.moveTo(px(a.x), px(a.y));
          ctx.lineTo(px(b.x), px(b.y));
          ctx.stroke();
        });
        ctx.lineCap = 'round';

        // 灯管白芯
        if (!dead) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.lineWidth = cell * 0.16;
          tracePath(ctx, segs, px);
          ctx.stroke();
        }

        // 头
        const hx = px(head.x);
        const hy = px(head.y);
        const perp = { x: -dir.y, y: dir.x };
        ctx.fillStyle = rgba(headColor);
        circle(ctx, hx, hy, cell * 0.4);
        ctx.fill();

        for (const side of [-1, 1]) {
          const ex = hx + dir.x * cell * 0.1 + perp.x * cell * 0.17 * side;
          const ey = hy + dir.y * cell * 0.1 + perp.y * cell * 0.17 * side;
          ctx.strokeStyle = '#06050c';
          ctx.fillStyle = '#06050c';
          if (dead) {
            const k = cell * 0.08;
            ctx.lineWidth = Math.max(1.5, cell * 0.06);
            ctx.beginPath();
            ctx.moveTo(ex - k, ey - k);
            ctx.lineTo(ex + k, ey + k);
            ctx.moveTo(ex + k, ey - k);
            ctx.lineTo(ex - k, ey + k);
            ctx.stroke();
          } else if (now % 3000 < 120) {
            ctx.lineWidth = Math.max(1.5, cell * 0.06);
            ctx.beginPath();
            ctx.moveTo(ex - perp.x * cell * 0.07, ey - perp.y * cell * 0.07);
            ctx.lineTo(ex + perp.x * cell * 0.07, ey + perp.y * cell * 0.07);
            ctx.stroke();
          } else {
            circle(ctx, ex, ey, cell * 0.075);
            ctx.fill();
          }
        }
      },

      sounds: {

  // ================= 星际（太空歌剧风）=================
  const scifi = (() => {

    const BLADES = {

    // 预生成闪烁星星（单位：棋盘比例）
    const rnd = seeded(7);

      x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.2, speed: 600 + rnd() * 1400, phase: rnd() * TAU,
    }));

    function shipPath(ctx, k) {
      // 机身（机头朝 +x）
      ctx.beginPath();
      ctx.moveTo(0.52 * k, 0);
      ctx.lineTo(-0.08 * k, 0.15 * k);
      ctx.lineTo(-0.3 * k, 0.11 * k);
      ctx.lineTo(-0.3 * k, -0.11 * k);
      ctx.lineTo(-0.08 * k, -0.15 * k);
      ctx.closePath();
    }

    function wingsPath(ctx, k) {
      ctx.beginPath();
      for (const s of [1, -1]) {
        ctx.moveTo(0.02 * k, 0.1 * s * k);
        ctx.lineTo(-0.26 * k, 0.48 * s * k);
        ctx.lineTo(-0.42 * k, 0.48 * s * k);
        ctx.lineTo(-0.28 * k, 0.08 * s * k);

    return {

        particles: {

          bonus: ['#7df9ff', '#ffffff', '#b8fbff'],
          death: ['#ffb347', '#ffffff', '#ff5e3a', '#ffe81f'],
          rock: ['#8a93a3', '#c7ced9'],

      buildBackground(g, size, cell) {
        const bg = g.createRadialGradient(size * 0.5, size * 0.4, 0, size * 0.5, size * 0.5, size * 0.8);
        bg.addColorStop(0, '#0a0f22');

        g.fillStyle = bg;
        g.fillRect(0, 0, size, size);

        // 星云
        for (const [x, y, r, c] of [
          [0.22, 0.28, 0.45, 'rgba(120, 60, 210, 0.16)'],
          [0.82, 0.7, 0.5, 'rgba(30, 130, 220, 0.12)'],
          [0.6, 0.15, 0.3, 'rgba(220, 60, 120, 0.07)'],
        ]) {
          const n = g.createRadialGradient(x * size, y * size, 0, x * size, y * size, r * size);
          n.addColorStop(0, c);
          n.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = n;
          g.fillRect(0, 0, size, size);
        }

        // 远处的行星
        const px = size * 0.98;
        const py = size * 1.04;
        const pr = size * 0.36;
        const planet = g.createRadialGradient(px - pr * 0.4, py - pr * 0.5, pr * 0.1, px, py, pr);
        planet.addColorStop(0, '#2a3358');
        planet.addColorStop(1, '#070a18');
        g.fillStyle = planet;
        g.beginPath();
        g.arc(px, py, pr, 0, TAU);
        g.fill();
        g.strokeStyle = 'rgba(120, 170, 255, 0.35)';
        g.lineWidth = 2;
        g.beginPath();
        g.arc(px, py, pr, Math.PI * 1.05, Math.PI * 1.55);
        g.stroke();

        // 静态星空
        const r = seeded(42);
        for (let i = 0; i < 160; i++) {
          g.fillStyle = `rgba(255,255,255,${0.15 + r() * 0.6})`;
          g.beginPath();
          g.arc(r() * size, r() * size, 0.3 + r() * 0.9, 0, TAU);
          g.fill();
        }

        // 战术网格
        g.strokeStyle = 'rgba(90, 170, 255, 0.06)';
        g.lineWidth = 1;
        g.beginPath();
        for (let i = 1; i < size / cell; i++) {
          g.moveTo(Math.round(i * cell) + 0.5, 0);
          g.lineTo(Math.round(i * cell) + 0.5, size);
          g.moveTo(0, Math.round(i * cell) + 0.5);
          g.lineTo(size, Math.round(i * cell) + 0.5);
        }
        g.stroke();
      },

      drawAmbient(ctx, size, cell, now) {
        twinkles.forEach((s) => {
          const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(now / s.speed + s.phase));
          ctx.fillStyle = `rgba(220, 235, 255, ${a})`;
          circle(ctx, s.x * size, s.y * size, s.r);
          ctx.fill();
        });

        // 每 8 秒划过一颗流星
        const cycle = Math.floor(now / 8000);
        const p = (now % 8000) / 900;
        if (p < 1) {
          const r = seeded(cycle + 1);
          const x0 = (0.2 + r() * 0.7) * size;
          const y0 = r() * 0.3 * size;
          const len = size * 0.35;
          const hx = x0 - len * p;
          const hy = y0 + len * 0.5 * p;
          const grad = ctx.createLinearGradient(hx, hy, hx + 60, hy - 30);
          grad.addColorStop(0, `rgba(255,255,255,${1 - p})`);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(hx, hy);
          ctx.lineTo(hx + 60, hy - 30);
          ctx.stroke();
        }
      },

      drawWall(ctx, x, y, cell) {
        // 金属装甲板
        const i = cell * 0.05;
        const s = cell - i * 2;
        const grad = ctx.createLinearGradient(x, y, x, y + cell);
        grad.addColorStop(0, '#4a5262');
        grad.addColorStop(1, '#1c212b');
        ctx.fillStyle = grad;
        ctx.fillRect(x + i, y + i, s, s);
        ctx.strokeStyle = '#6b7588';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + i + 0.5, y + i + 0.5, s - 1, s - 1);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.moveTo(x + i + s * 0.15, y + cell / 2);
        ctx.lineTo(x + i + s * 0.85, y + cell / 2);
        ctx.stroke();
        ctx.fillStyle = '#9aa4b5';
        for (const [dx, dy] of [[0.2, 0.2], [0.8, 0.2], [0.2, 0.8], [0.8, 0.8]]) {
          circle(ctx, x + cell * dx, y + cell * dy, Math.max(0.8, cell * 0.04));
          ctx.fill();
        }
      },

      drawFood(ctx, cx, cy, cell, scale, now) {
        // 带光环的小行星
        const r = cell * 0.27 * scale;
        if (r <= 0) return;
        const tilt = -0.45;
        const ringR = r * 1.75;
        const ringW = Math.max(1.2, cell * 0.06);

        const ring = (from, to) => {
          ctx.strokeStyle = 'rgba(255, 220, 160, 0.85)';
          ctx.lineWidth = ringW;
          ctx.beginPath();
          ctx.ellipse(cx, cy, ringR, ringR * 0.32, tilt, from, to);
          ctx.stroke();
        };

        ring(Math.PI, TAU); // 背面
        ctx.save();
        ctx.shadowColor = '#ffb347';
        ctx.shadowBlur = cell * (0.6 + 0.15 * Math.sin(now / 260));
        const grad = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
        grad.addColorStop(0, '#ffe2a8');
        grad.addColorStop(0.6, '#f0913a');
        grad.addColorStop(1, '#a8431c');
        ctx.fillStyle = grad;
        circle(ctx, cx, cy, r);
        ctx.fill();
        ctx.restore();
        ctx.save();
        circle(ctx, cx, cy, r);
        ctx.clip();
        ctx.fillStyle = 'rgba(120, 40, 10, 0.25)';
        ctx.fillRect(cx - r, cy - r * 0.15, r * 2, r * 0.22);
        ctx.fillRect(cx - r, cy + r * 0.35, r * 2, r * 0.14);
        ctx.restore();
        ring(0, Math.PI); // 正面
      },

      drawBonus(ctx, cx, cy, cell, scale, now) {
        // 发光能量晶体
        const r = cell * 0.42 * scale;
        if (r <= 0) return;
        const bob = Math.sin(now / 300) * cell * 0.04;
        ctx.save();
        ctx.translate(cx, cy + bob);
        ctx.rotate(Math.sin(now / 900) * 0.25);
        ctx.shadowColor = '#7df9ff';
        ctx.shadowBlur = cell * (0.8 + 0.3 * Math.sin(now / 150));
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.42, -r * 0.2);
        ctx.lineTo(r * 0.3, r * 0.75);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.3, r * 0.75);
        ctx.lineTo(-r * 0.42, -r * 0.2);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, -r, 0, r);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#9ff7ff');
        grad.addColorStop(1, '#2bb7d6');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(0, r);
        ctx.moveTo(-r * 0.42, -r * 0.2);
        ctx.lineTo(r * 0.42, -r * 0.2);
        ctx.stroke();
        ctx.restore();
      },

      drawSnake(ctx, s) {
        const { segs, head, cell, px, fade, now, dir, dead, difficulty } = s;
        const blade = mix(BLADES[difficulty] || BLADES.normal, DEAD, fade);
        const flicker = dead ? 1 : 1 + Math.sin(now / 23) * 0.04 + Math.sin(now / 57) * 0.03;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 光束：外晕 → 光身 → 白色内核
        const layers = dead
          ? [[0.5, rgba(blade, 0.9)]]
          : [
              // 多层逐级加深，模拟柔和光晕（避免 shadowBlur 的性能开销）
              [1.5, rgba(blade, 0.035)],
              [1.3, rgba(blade, 0.05)],
              [1.1, rgba(blade, 0.08)],
              [0.92, rgba(blade, 0.14)],
              [0.76, rgba(blade, 0.3)],
              [0.6, rgba(blade, 0.85)],
              [0.3 * flicker, 'rgba(255,255,255,0.95)'],
            ];
        layers.forEach(([w, color]) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = cell * w;
          tracePath(ctx, segs, px);
          ctx.stroke();
        });

        // 舰首：小型战机
        const hx = px(head.x);
        const hy = px(head.y);
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(Math.atan2(dir.y, dir.x) + (dead ? 0.5 : 0));
        const k = cell * 1.05;

        if (!dead) {
          // 引擎尾焰
          ctx.fillStyle = rgba(blade, 0.6);
          circle(ctx, -0.32 * k, 0, 0.13 * k * flicker);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          circle(ctx, -0.3 * k, 0, 0.06 * k);
          ctx.fill();
        }

        wingsPath(ctx, k);
        ctx.fillStyle = dead ? '#3a3f48' : '#8792a6';
        ctx.fill();
        ctx.strokeStyle = dead ? '#22262d' : '#4b5466';
        ctx.lineWidth = 1;
        ctx.stroke();

        shipPath(ctx, k);
        const hull = ctx.createLinearGradient(0, -0.15 * k, 0, 0.15 * k);
        hull.addColorStop(0, dead ? '#4b5058' : '#eef2f8');
        hull.addColorStop(1, dead ? '#2a2e35' : '#9aa5b8');
        ctx.fillStyle = hull;
        ctx.fill();
        ctx.stroke();

        // 驾驶舱
        ctx.fillStyle = dead ? '#1a1d22' : rgba(blade);
        circle(ctx, 0.14 * k, 0, 0.065 * k);
        ctx.fill();
        // 翼尖红灯
        if (!dead && now % 1200 < 600) {
          ctx.fillStyle = '#ff4d4d';
          circle(ctx, -0.34 * k, 0.46 * k, 0.03 * k);
          ctx.fill();
          circle(ctx, -0.34 * k, -0.46 * k, 0.03 * k);
          ctx.fill();
        }
        ctx.restore();
      },

      sounds: {

  // ================= 甜心（可爱少女风）=================
  const sweet = (() => {

      colors: {

          death: ['#ff7eb3', '#c9a7ff', '#ffd36e', '#8fe3cf'],

      particleShapes: ['heart', 'sparkle', 'heart'],
      gravity: -3, // 爱心往上飘

      buildBackground(g, size, cell) {

      drawWall(ctx, x, y, cell) {

        // 浅色棋盘上要一眼看见：投影 + 淡紫描边 + 白色云身
        cloud(cell * 0.09, '#d2bdfb');
        cloud(0, '#b99cf0', Math.max(1, cell * 0.035));
        cloud(0, '#ffffff');
      },

      drawFood(ctx, cx, cy, cell, scale, now) {
        // 草莓
        const r = cell * 0.36 * scale;
        if (r <= 0) return;
        cy += Math.sin(now / 320) * cell * 0.035;
        ctx.save();
        ctx.shadowColor = 'rgba(255, 80, 130, 0.35)';
        ctx.shadowBlur = cell * 0.35;
        ctx.shadowOffsetY = cell * 0.06;
        ctx.beginPath();
        ctx.moveTo(cx, cy + r * 0.95);
        ctx.bezierCurveTo(cx - r * 1.1, cy + r * 0.35, cx - r * 0.95, cy - r * 0.75, cx, cy - r * 0.5);
        ctx.bezierCurveTo(cx + r * 0.95, cy - r * 0.75, cx + r * 1.1, cy + r * 0.35, cx, cy + r * 0.95);
        const grad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
        grad.addColorStop(0, '#ff7f9f');
        grad.addColorStop(1, '#ff3d6e');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#ffe9a6';
        for (const [dx, dy] of [[-0.35, -0.05], [0.05, -0.15], [0.38, 0], [-0.15, 0.3], [0.2, 0.35], [0, 0.62]]) {
          ctx.beginPath();
          ctx.ellipse(cx + dx * r, cy + dy * r, r * 0.06, r * 0.09, 0, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.42, cy - r * 0.2, r * 0.12, r * 0.22, 0.5, 0, TAU);
        ctx.fill();

        ctx.fillStyle = '#5fcf7c';
        star(ctx, cx, cy - r * 0.55, r * 0.45, 0.45, 5);
        ctx.fill();
        ctx.strokeStyle = '#4bb868';
        ctx.lineWidth = Math.max(1, r * 0.1);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy - r * 0.65);
        ctx.lineTo(cx + r * 0.12, cy - r * 0.95);
        ctx.stroke();
      },

      drawBonus(ctx, cx, cy, cell, scale, now) {
        // 会笑的星星糖
        const r = cell * 0.44 * scale;
        if (r <= 0) return;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.sin(now / 380) * 0.2);
        ctx.shadowColor = 'rgba(255, 190, 40, 0.6)';
        ctx.shadowBlur = cell * 0.5;
        star(ctx, 0, 0, r, 0.52);
        const grad = ctx.createLinearGradient(0, -r, 0, r);
        grad.addColorStop(0, '#fff3a6');
        grad.addColorStop(1, '#ffc23c');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1.2, cell * 0.06);
        ctx.stroke();
        // 表情
        ctx.fillStyle = INK;
        circle(ctx, -r * 0.18, r * 0.02, r * 0.07);
        ctx.fill();
        circle(ctx, r * 0.18, r * 0.02, r * 0.07);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 110, 160, 0.5)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.32, r * 0.18, r * 0.1, r * 0.06, 0, 0, TAU);
        ctx.ellipse(r * 0.32, r * 0.18, r * 0.1, r * 0.06, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = INK;
        ctx.lineWidth = Math.max(1, r * 0.06);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, r * 0.12, r * 0.1, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
        ctx.restore();
      },

      drawSnake(ctx, s) {
        const { beads, cell, px, fade, now, dir, dead } = s;
        const n = beads.length;

        // 身体：一颗颗糖果色圆珠，从尾到头画
        for (let i = n - 1; i >= 1; i--) {
          const t = i / Math.max(1, n - 1);
          const color = mix(mix3(C.head, C.mid, C.tail, t), C.dead, fade);
          const bx = px(beads[i].x);
          const by = px(beads[i].y);
          const r = cell * (0.43 - 0.08 * t);
          ctx.fillStyle = 'rgba(200, 110, 160, 0.16)';
          circle(ctx, bx, by + cell * 0.07, r);
          ctx.fill();
          ctx.fillStyle = rgba(color);
          circle(ctx, bx, by, r);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.lineWidth = Math.max(1.2, cell * 0.05);
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.65)';
          circle(ctx, bx - r * 0.32, by - r * 0.36, r * 0.26);
          ctx.fill();
        }

        // 头：始终正脸朝上，眼珠看向前进方向
        const hx = px(beads[0].x);
        const hy = px(beads[0].y) + (dead ? 0 : Math.sin(now / 160) * cell * 0.02);
        const r = cell * 0.5;
        ctx.fillStyle = 'rgba(200, 110, 160, 0.2)';
        circle(ctx, hx, hy + cell * 0.08, r);
        ctx.fill();
        ctx.fillStyle = rgba(mix(C.head, C.dead, fade));
        circle(ctx, hx, hy, r);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1.5, cell * 0.06);
        ctx.stroke();

        // 腮红
        ctx.fillStyle = 'rgba(255, 90, 150, 0.4)';
        ctx.beginPath();
        ctx.ellipse(hx - r * 0.55, hy + r * 0.25, r * 0.17, r * 0.1, 0, 0, TAU);
        ctx.ellipse(hx + r * 0.55, hy + r * 0.25, r * 0.17, r * 0.1, 0, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = INK;
        ctx.fillStyle = INK;
        ctx.lineWidth = Math.max(1.3, r * 0.09);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const blink = !dead && now % 3200 < 130;
        for (const side of [-1, 1]) {
          const ex = hx + side * r * 0.33;
          const ey = hy - r * 0.05;
          if (dead) {
            // > < 眯眼
            ctx.beginPath();
            ctx.moveTo(ex - side * r * 0.12, ey - r * 0.1);
            ctx.lineTo(ex + side * r * 0.06, ey);
            ctx.lineTo(ex - side * r * 0.12, ey + r * 0.1);
            ctx.stroke();
          } else if (blink) {
            ctx.beginPath();
            ctx.arc(ex, ey, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.ellipse(ex + dir.x * r * 0.07, ey + dir.y * r * 0.07, r * 0.14, r * 0.18, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            circle(ctx, ex + dir.x * r * 0.07 - r * 0.05, ey + dir.y * r * 0.07 - r * 0.07, r * 0.06);
            ctx.fill();
            circle(ctx, ex + dir.x * r * 0.07 + r * 0.05, ey + dir.y * r * 0.07 + r * 0.06, r * 0.03);
            ctx.fill();
            ctx.fillStyle = INK;
          }
        }

        // 嘴巴
        ctx.beginPath();
        if (dead) {
          ctx.moveTo(hx - r * 0.12, hy + r * 0.32);
          ctx.quadraticCurveTo(hx - r * 0.06, hy + r * 0.24, hx, hy + r * 0.32);
          ctx.quadraticCurveTo(hx + r * 0.06, hy + r * 0.4, hx + r * 0.12, hy + r * 0.32);
        } else {
          // ω 形小嘴
          ctx.arc(hx - r * 0.07, hy + r * 0.24, r * 0.07, 0.1 * Math.PI, 0.95 * Math.PI);
          ctx.moveTo(hx + r * 0.14, hy + r * 0.25);
          ctx.arc(hx + r * 0.07, hy + r * 0.24, r * 0.07, 0.05 * Math.PI, 0.9 * Math.PI);
        }
        ctx.stroke();

        bow(ctx, hx + r * 0.5, hy - r * 0.72, r * 0.62);
      },

      sounds: {
        start: (a) => a.arp([784, 988, 1175, 1568], 0.08, { type: 'sine', vol: 0.09 }),
        tick: (a) => a.tone(1320, 0.07, { type: 'sine', vol: 0.06 }),
        eat: (a) => {
          a.tone(700, 0.08, { type: 'sine', to: 1400, vol: 0.1 });
          a.tone(1760, 0.1, { type: 'sine', vol: 0.05, delay: 0.06 });
        },
        bonus: (a) => a.arp([1047, 1319, 1568, 2093, 2637], 0.055, { type: 'sine', vol: 0.07 }),
        level: (a) => a.arp([784, 988, 1175, 1568], 0.09, { type: 'triangle', vol: 0.08 }),
        die: (a) => {
          a.tone(620, 0.2, { type: 'triangle', to: 470, vol: 0.09 });
          a.tone(470, 0.35, { type: 'triangle', to: 300, vol: 0.09, delay: 0.2 });
        },
        win: (a) => a.arp([1047, 1175, 1319, 1568, 1760, 2093], 0.09, { type: 'sine', vol: 0.08 }),
        click: (a) => a.tone(1100, 0.04, { type: 'sine', vol: 0.05 }),
      },
    };
  })();

  return {
    list: [neon, scifi, sweet],
    byId: { neon, scifi, sweet },
    drawParticle,
  };
})();
